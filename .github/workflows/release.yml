name: Release

# Builds the API and web images and publishes them to GitHub Container Registry.
# The VM pulls these images; it never builds from source. A 1 vCPU / 1 GB VM
# cannot build the application itself.
# Deployment to the VM is a separate, manually approved workflow.

'on':
  push:
    branches: [master, main]
  workflow_dispatch:

# Never publish from a pull request.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/taptalk-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/taptalk-web

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve API tags
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          # Immutable commit-SHA tag plus a moving branch tag.
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve web tags
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          # metadata-action already emits fully qualified references.
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Record published digests
        run: |
          {
            echo "### Published images"
            echo ""
            echo "- API: \`${{ env.API_IMAGE }}\`"
            echo "- Web: \`${{ env.WEB_IMAGE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
